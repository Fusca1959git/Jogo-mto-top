<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Clicker</title>
</head>
<body>
    <main class="jogo">

        <h1>Clicker</h1>

        <div class="informacoes">
   
            <div class="sub-info">
                <span>Pontos:</span>
                <strong id="pontos">0</strong>
            </div>

            <div class="sub-info">
                <span>Multiplicador:</span>
                <strong>X<span id="multiplicador">1</span></strong>
            </div>

        </div>
        
        <p class="timer">tempo: <span id="tempo">35</span>s</p>

        <button id="butao">
            <strong>CLICK</strong>
        </button>

        <p id="aviso">Clique na bola</p>

    </main>

    <video src="vd.mp4" id="vd"></video>

    <script src="script.js"></script>

</body>
</html>
